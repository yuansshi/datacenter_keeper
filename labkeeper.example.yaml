# Generic Labkeeper configuration. Replace documentation-only endpoints in your inventory.
# Relative paths are relative to this file.
# Environment overrides use LABKEEPER_<SECTION>__<KEY>.

data_dir: ./data
host: 127.0.0.1
port: 8000

testbeds:
  paths: [./testbeds]
  watch: true
  # Shared infrastructure is visible but does not create exclusive booking conflicts.
  shared_device_types: [rpi, linux, server, ixia, ixia-rest, jump_host, terminal_server]
  location_pattern: '^(?P<rack>.+?)[_\-\s]U(?P<position>\d{1,3})$'
  default_rack_height: 42
  exclude: ["**/archive/**"]
  # Empty means all leaf testbeds. Otherwise use names, stems, relative paths, or globs.
  include: []

reachability:
  enabled: true
  ports: [22, 443]
  poll_interval: 120
  timeout: 2.0
  concurrency: 32

# Optional adapter: enable deliberately and supply your own API key in the environment.
meraki:
  enabled: false
  api_key_env: MERAKI_DASHBOARD_API_KEY
  base_url: https://api.meraki.com/api/v1
  org_ids: []
  regions: []
  regions_from_testbeds: false
  poll_interval: 60
  inventory_interval: 900

booking:
  default_duration_minutes: 120
  max_duration_days: 14
  # Courtesy lab policy: anyone can release a reservation, with attribution.
  # For owner-only releases, set owner AND allow_force_release: false.
  release_policy: anyone
  allow_force_release: true

console:
  timeout: 8
  send_newline: true
  allow_proxy: true
  verify_host_keys: true

agent:
  enabled: false
  # Install the ai extra, configure your own ANTHROPIC_API_KEY, and select a supported model.
  model: ""

auth:
  user_header: X-Labkeeper-User
  default_user: anonymous

cors_origins: []
