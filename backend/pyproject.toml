[project]
name = "labkeeper"
version = "0.1.0"
description = "Adaptable lab management combining equipment checks and shared-resource booking"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
requires-python = ">=3.11"
authors = [{ name = "Labkeeper contributors" }]
keywords = ["testbed", "lab", "reservation", "pyats", "health-checks", "network", "inventory", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "Topic :: System :: Networking",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "watchfiles>=0.22",
  "python-multipart>=0.0.9",
  "asyncssh>=2.14",
  "mcp>=1.9",
]

[project.urls]
Homepage = "https://github.com/yuansshi/labkeeper"
Repository = "https://github.com/yuansshi/labkeeper"
Issues = "https://github.com/yuansshi/labkeeper/issues"

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
labkeeper = "labkeeper.cli:main"

[project.entry-points."labkeeper.providers"]
meraki = "labkeeper.providers.meraki:MerakiProvider"
reachability = "labkeeper.providers.reachability:ReachabilityProvider"
demo = "labkeeper.providers.demo:DemoProvider"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "anthropic>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labkeeper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
